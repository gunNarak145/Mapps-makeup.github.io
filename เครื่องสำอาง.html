  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #fdf4f5; color: #2b1a2f; line-height: 1.6; }
    a { color: inherit; text-decoration: none; }
    .wrap { max-width: 1000px; margin: 0 auto; padding: 0 20px; }


    header { background: #fff; border-bottom: 1px solid #ebd9de; }
    header .wrap { display: flex; justify-content: space-between; align-items: center; height: 64px; }
    .logo { font-size: 1.3rem; font-weight: 700; }
    nav a { margin-left: 20px; color: #6e5a73; }
    nav a:hover { color: #b3365c; }


    .hero { background: #b3365c; color: #fff; padding: 72px 0; text-align: center; }
    .hero h1 { font-size: clamp(2rem, 6vw, 3.2rem); margin: 0 0 12px; }
    .hero p { margin: 0 0 24px; opacity: .9; }
    .btn { display: inline-block; background: #fff; color: #b3365c; padding: 12px 28px; border-radius: 999px; font-weight: 600; }


    section { padding: 48px 0; }
    h2 { margin: 0 0 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
    .card { background: #fff; border: 1px solid #ebd9de; border-radius: 16px; overflow: hidden; }
    .card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: #f3dde1; }
    .info { padding: 12px 14px 16px; }
    .info h3 { font-size: 1rem; margin: 0; }
    .info p { margin: 4px 0 0; color: #6e5a73; }


    footer { background: #2b1a2f; color: #d9c7de; padding: 28px 0; text-align: center; font-size: .9rem; }
  </style>
</head>
